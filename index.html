<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Dashboard | Emcar Sport</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>

    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0a0f18">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Mech Center">
    <link rel="apple-touch-icon" href="icon-192.png">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,700;1,900&display=swap');
        body { font-family: 'Barlow Condensed', sans-serif; overflow-x: hidden; }
        .stats-card { background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); }
        .nav-card { cursor: pointer; transition: all 0.3s ease; }
        .nav-card:hover { transform: translateY(-5px); }
        .modal-animate { animation: fadeIn 0.2s ease-out; }
        @keyframes fadeIn { from{opacity:0;transform:scale(0.95)} to{opacity:1;transform:scale(1)} }
    </style>
</head>
<body class="bg-[#0a0f18] text-white italic uppercase min-h-screen flex items-center justify-center">

    <!-- LOGIN -->
    <div id="loginSection" class="w-full max-w-md p-8 bg-white rounded-[2rem] text-slate-900 shadow-2xl mx-4">
        <img src="https://raw.githubusercontent.com/cyclingandtrailspecialist-collab/emcar-sport/main/images.png" class="h-16 mx-auto mb-6">
        <h2 class="text-3xl font-black text-center mb-6 italic uppercase tracking-tighter">ACCÈS RÉSERVÉ</h2>
        <div class="space-y-4">
            <input type="text" id="user" placeholder="UTILISATEUR" class="w-full p-4 border-2 border-slate-100 rounded-2xl font-black outline-none focus:border-[#004a99] uppercase italic text-slate-900">
            <input type="password" id="pass" placeholder="MOT DE PASSE" class="w-full p-4 border-2 border-slate-100 rounded-2xl font-black outline-none focus:border-[#004a99] uppercase italic text-slate-900" onkeydown="if(event.key==='Enter') checkLogin()">
            <button onclick="checkLogin()" class="w-full bg-[#004a99] text-white py-4 rounded-2xl font-black hover:bg-blue-700 transition-all uppercase italic">SE CONNECTER</button>
        </div>
    </div>

    <!-- DASHBOARD -->
    <div id="dashSection" class="hidden max-w-7xl w-full p-6 text-center">
        <img src="https://raw.githubusercontent.com/cyclingandtrailspecialist-collab/emcar-sport/main/images.png" alt="Emcar Sport" class="h-20 mx-auto mb-6 bg-white p-2 rounded-lg object-contain shadow-xl">
        <h1 class="text-5xl font-black tracking-tighter mb-8 italic uppercase">WORKSHOP <span class="text-[#004a99]">MANAGEMENT</span></h1>

        <!-- ROW 1 — Navigation principale -->
        <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-4">

            <!-- Planning -->
            <div onclick="goTo('planning.html')" class="nav-card bg-white text-slate-900 p-7 rounded-3xl hover:bg-[#004a99] hover:text-white shadow-2xl flex flex-col justify-center items-center">
                <div class="text-5xl mb-3">📅</div>
                <div class="text-2xl font-black leading-none italic uppercase">Planning<br><span class="text-xs opacity-50 uppercase">Atelier</span></div>
            </div>

            <!-- Transferts -->
            <div onclick="goTo('transfer.html')" class="nav-card bg-white text-slate-900 p-7 rounded-3xl hover:bg-[#e67e22] hover:text-white shadow-2xl flex flex-col justify-center items-center">
                <div class="text-5xl mb-3">🚚</div>
                <div class="text-2xl font-black leading-none italic uppercase">Transferts<br><span class="text-xs opacity-50 uppercase">Logistique</span></div>
            </div>

            <!-- RDV Dashboard -->
            <div onclick="goTo('rdv-dashboard.html')" class="nav-card bg-white text-slate-900 p-7 rounded-3xl hover:bg-emerald-600 hover:text-white shadow-2xl flex flex-col justify-center items-center">
                <div class="text-5xl mb-3">📊</div>
                <div class="text-2xl font-black leading-none italic uppercase">RDV<br><span class="text-xs opacity-50 uppercase">Dashboard</span></div>
            </div>

            <!-- Nouveau RDV client (accès direct) -->
            <div onclick="goTo('rdv-form.html')" class="nav-card bg-white text-slate-900 p-7 rounded-3xl hover:bg-[#004a99] hover:text-white shadow-2xl flex flex-col justify-center items-center">
                <div class="text-5xl mb-3">📋</div>
                <div class="text-2xl font-black leading-none italic uppercase">Nouveau<br><span class="text-xs opacity-50 uppercase">RDV Client</span></div>
            </div>
        </div>

        <!-- ROW 2 — Stats + QR Code -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-4 mb-6">

            <!-- Stats Workshop -->
            <div class="lg:col-span-2 stats-card p-7 rounded-3xl border-2 border-slate-800 shadow-2xl text-left">
                <h3 class="text-xl font-black italic text-blue-400 uppercase mb-5">STATS WORKSHOP</h3>
                <div class="grid grid-cols-3 gap-4 font-black">
                    <div class="bg-slate-800/40 p-5 rounded-2xl">
                        <p class="text-[10px] text-slate-400 mb-2">AUJOURD'HUI</p>
                        <p id="day-total" class="text-5xl font-black italic mb-3">0</p>
                        <div class="text-[11px] space-y-1 border-t border-slate-700 pt-3 italic">
                            <div class="flex justify-between"><span class="text-blue-400 font-black">S:</span><span id="day-serv">0</span></div>
                            <div class="flex justify-between"><span class="text-[#e67e22] font-black">M:</span><span id="day-mont">0</span></div>
                        </div>
                    </div>
                    <div class="bg-slate-800/40 p-5 rounded-2xl">
                        <p class="text-[10px] text-slate-400 mb-2">SEMAINE</p>
                        <p id="week-total" class="text-5xl font-black italic mb-3">0</p>
                        <div class="text-[11px] space-y-1 border-t border-slate-700 pt-3 italic">
                            <div class="flex justify-between"><span class="text-blue-400 font-black">S:</span><span id="week-serv">0</span></div>
                            <div class="flex justify-between"><span class="text-[#e67e22] font-black">M:</span><span id="week-mont">0</span></div>
                        </div>
                    </div>
                    <div class="bg-slate-800/40 p-5 rounded-2xl">
                        <p class="text-[10px] text-slate-400 mb-2">MOIS</p>
                        <p id="month-total" class="text-5xl font-black italic mb-3">0</p>
                        <div class="text-[11px] space-y-1 border-t border-slate-700 pt-3 italic">
                            <div class="flex justify-between"><span class="text-blue-400 font-black">S:</span><span id="month-serv">0</span></div>
                            <div class="flex justify-between"><span class="text-[#e67e22] font-black">M:</span><span id="month-mont">0</span></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- QR Code formulaire RDV -->
            <div class="stats-card p-7 rounded-3xl border-2 border-slate-800 shadow-2xl flex flex-col items-center justify-center">
                <p class="text-[9px] text-slate-400 font-black tracking-widest not-italic mb-3">FORMULAIRE CLIENT</p>
                <p class="text-xl font-black italic text-[#004a99] mb-4 leading-none">QR CODE RDV</p>
                <div class="bg-white p-3 rounded-2xl shadow-inner mb-3">
                    <canvas id="qrCanvas"></canvas>
                </div>
                <p class="text-[8px] text-slate-400 not-italic normal-case text-center leading-relaxed mb-3">Scannez pour accéder au formulaire de prise de RDV</p>
                <div class="flex gap-2 w-full">
                    <button onclick="downloadQR()" class="flex-1 bg-[#004a99] hover:bg-blue-700 text-white py-2 rounded-xl font-black text-[9px] tracking-widest transition-all not-italic uppercase">⬇ TÉLÉCHARGER</button>
                    <button onclick="copyRDVLink()" class="flex-1 bg-slate-700 hover:bg-slate-600 text-white py-2 rounded-xl font-black text-[9px] tracking-widest transition-all not-italic uppercase">🔗 COPIER LIEN</button>
                </div>
            </div>
        </div>

        <button onclick="logout()" class="text-slate-500 text-[10px] tracking-[0.3em] font-bold uppercase italic hover:text-red-500">
            DÉCONNEXION / SESSION : <span id="currentUser" class="text-blue-500"></span>
        </button>
    </div>

    <script>
        const SCRIPT_URL  = "https://script.google.com/macros/s/AKfycbzrpGb7CVA4SFYGw2iGEQaacD1DWueysMg7Tgjm15g_bPY6J-Zh_pFA8Vha3aFi7a-F/exec";
        const CREDENTIALS = { "xavier": "emcar2026", "admin": "emcar2026" };
        const RDV_FORM_URL = "https://emcarsport.github.io/mech-center/rdv-form.html";

        function checkLogin() {
            const u = document.getElementById('user').value.toLowerCase();
            const p = document.getElementById('pass').value;
            if (CREDENTIALS[u] && CREDENTIALS[u] === p) {
                localStorage.setItem('emcar_auth', u);
                showDashboard(u);
            } else { alert("Erreur d'accès"); }
        }

        function showDashboard(user) {
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('dashSection').style.display  = 'block';
            document.getElementById('currentUser').innerText = user;
            loadStats();
            generateQR();
        }

        function goTo(page) {
            window.location.href = window.location.href.substring(0, window.location.href.lastIndexOf('/') + 1) + page;
        }

        function logout() { localStorage.clear(); location.reload(); }

        // ---- QR CODE ----
        function generateQR() {
            QRCode.toCanvas(document.getElementById('qrCanvas'), RDV_FORM_URL, {
                width: 140,
                margin: 1,
                color: { dark: '#0a0f18', light: '#ffffff' }
            }, function(err) { if (err) console.error(err); });
        }

        function downloadQR() {
            const canvas = document.getElementById('qrCanvas');
            const link   = document.createElement('a');
            link.download = 'emcar-rdv-qrcode.png';
            link.href     = canvas.toDataURL('image/png');
            link.click();
        }

        function copyRDVLink() {
            navigator.clipboard.writeText(RDV_FORM_URL).then(() => {
                alert('Lien copié !\n\n' + RDV_FORM_URL);
            });
        }

        // ---- STATS ----
        async function loadStats() {
            try {
                const res   = await fetch(SCRIPT_URL + "?getTasks=true");
                const tasks = await res.json();
                const now   = new Date();
                let s = {d:0,w:0,m:0}, m = {d:0,w:0,m:0};
                tasks.forEach(t => {
                    const tDate = new Date(t.date);
                    if (isNaN(tDate)) return;
                    const isDay   = tDate.toDateString() === now.toDateString();
                    const isMonth = tDate.getMonth() === now.getMonth() && tDate.getFullYear() === now.getFullYear();
                    const diffDays = Math.ceil(Math.abs(now - tDate) / (1000*60*60*24));
                    if (t.type === "Servicing") { if(isDay) s.d++; if(diffDays<=7) s.w++; if(isMonth) s.m++; }
                    else if (t.type === "Montage") { if(isDay) m.d++; if(diffDays<=7) m.w++; if(isMonth) m.m++; }
                });
                document.getElementById('day-total').innerText   = s.d + m.d;
                document.getElementById('day-serv').innerText    = s.d;
                document.getElementById('day-mont').innerText    = m.d;
                document.getElementById('week-total').innerText  = s.w + m.w;
                document.getElementById('week-serv').innerText   = s.w;
                document.getElementById('week-mont').innerText   = m.w;
                document.getElementById('month-total').innerText = s.m + m.m;
                document.getElementById('month-serv').innerText  = s.m;
                document.getElementById('month-mont').innerText  = m.m;
            } catch(e) {}
        }

        if (localStorage.getItem('emcar_auth')) showDashboard(localStorage.getItem('emcar_auth'));

        // Service Worker PWA
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('service-worker.js').catch(() => {});
        }
    </script>
</body>
</html>

        @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,700;1,900&display=swap');
        body { font-family: 'Barlow Condensed', sans-serif; }
        ::-webkit-scrollbar { height: 8px; width: 6px; }

<body class="bg-[#f4f7f9] italic uppercase text-[11px]">

    <nav class="bg-[#0a0f18] text-white p-3 flex justify-between items-center shadow-2xl border-b-2 border-[#004a99]">
        <div class="flex items-center gap-4 cursor-pointer" onclick="location.reload()">
            <div class="bg-white p-1.5 rounded-lg shadow-inner">

            </div>
        </div>
        <div class="flex gap-2 items-center">
            <!-- Navigation semaine -->
            <button onclick="changeWeek(-1)" class="bg-slate-700 hover:bg-slate-600 text-white px-3 py-2 rounded-lg transition-all font-black text-lg leading-none">&#8592;</button>
            <div class="flex flex-col items-center min-w-[130px]">
                <span id="weekLabel" class="text-[10px] font-black tracking-widest text-white uppercase not-italic"></span>

            <button onclick="changeWeek(1)" class="bg-slate-700 hover:bg-slate-600 text-white px-3 py-2 rounded-lg transition-all font-black text-lg leading-none">&#8594;</button>

            <button onclick="openForm('Servicing')" class="bg-[#004a99] hover:bg-blue-700 text-white px-4 py-2 rounded-lg transition-all shadow-lg flex items-center gap-2">

            <button onclick="openForm('Montage')" class="bg-[#e67e22] hover:bg-orange-600 text-white px-4 py-2 rounded-lg transition-all shadow-lg flex items-center gap-2">

            <button onclick="openRapport()" class="bg-slate-700 hover:bg-slate-600 text-white px-4 py-2 rounded-lg transition-all flex items-center gap-2 font-black tracking-widest">

    </nav>

    <!-- CALENDAR — identique à l'original -->
    <main id="calendarGrid" class="p-6 flex gap-4 overflow-x-auto h-[calc(100vh-75px)]"></main>

    <!-- TASK MODAL — identique à l'original -->
    <div id="taskModal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-md z-[2000] flex items-center justify-center p-4">
        <div class="bg-white rounded-[2rem] w-full max-w-xl p-8 shadow-2xl modal-animate overflow-y-auto max-h-[95vh] border-t-8 border-[#004a99]">
            <div class="flex justify-between items-center mb-6 border-b pb-4">
                <div class="flex flex-col">
                    <span class="text-[#004a99] text-[9px] font-black tracking-widest">EMCAR SPORT ATELIER</span>
                    <h2 id="modalTitle" class="text-3xl font-black text-slate-900 leading-none tracking-tighter italic">FICHE TECHNIQUE</h2>
                </div>
                <button onclick="closeModal()" class="text-3xl text-slate-300 font-bold hover:text-red-500">×</button>
            </div>
            <input type="hidden" id="f_id">
            <div class="grid grid-cols-2 gap-5">
                <div class="col-span-2">
                    <label class="text-slate-500 text-[9px] mb-1 block font-black uppercase tracking-widest">Client / Magasin</label>
                    <input id="f_name" class="w-full border-2 border-slate-100 p-3 rounded-xl outline-none focus:border-[#004a99] bg-slate-50 font-black text-sm">
                </div>
                <div id="servicingFields" class="col-span-2 grid grid-cols-2 gap-5 hidden">
                    <div class="col-span-2 md:col-span-1">
                        <label class="text-[#004a99] text-[9px] mb-1 block font-black uppercase tracking-widest">Modèle (ex: Scalpel, Trail 3...)</label>
                        <input id="f_servModel" class="w-full border-2 border-slate-100 p-3 rounded-xl outline-none bg-blue-50 font-black text-sm">
                    </div>
                    <div class="col-span-2 md:col-span-1">
                        <label class="text-slate-500 text-[9px] mb-1 block font-black uppercase tracking-widest">Téléphone</label>
                        <input id="f_phone" type="tel" class="w-full border-2 border-slate-100 p-3 rounded-xl font-black text-sm">
                    </div>
                    <div class="col-span-2">
                        <label class="text-slate-500 text-[9px] mb-1 block font-black uppercase tracking-widest">Type Service / Réparation</label>
                        <select id="f_servType" class="w-full border-2 border-slate-100 p-3 rounded-xl font-black text-sm cursor-pointer">
                            <option value="Minor Servicing">Minor Servicing</option>
                            <option value="Full Servicing">Full Servicing</option>
                            <option value="Réparations">Réparations</option>
                            <option value="First Check-Up">First Check-Up</option>
                        </select>
                    </div>
                </div>
                <div id="montageFields" class="col-span-2 grid grid-cols-2 gap-5 hidden">
                    <div class="col-span-2 md:col-span-1">
                        <label class="text-orange-600 text-[9px] mb-1 block font-black uppercase tracking-widest">Type Montage</label>
                        <select id="f_reqType" class="w-full border-2 border-slate-100 p-3 rounded-xl font-black text-sm"><option value="Stock">Stock</option><option value="Vendu">Vendu</option></select>
                    </div>
                    <div class="col-span-2 md:col-span-1">
                        <label class="text-slate-500 text-[9px] mb-1 block font-black uppercase tracking-widest">Modèle Vélo</label>
                        <input id="f_model" class="w-full border-2 border-slate-100 p-3 rounded-xl bg-orange-50 font-black text-sm">
                    </div>
                </div>
                <div class="col-span-2 md:col-span-1">
                    <label class="text-[#004a99] text-[9px] mb-1 block font-black uppercase tracking-widest">Planification</label>
                    <input id="f_date" type="date" class="w-full border-2 border-blue-100 p-3 rounded-xl outline-none bg-blue-50 font-black text-sm">
                </div>
                <div class="col-span-2 md:col-span-1">
                    <label class="text-slate-500 text-[9px] mb-1 block font-black uppercase tracking-widest">Statut</label>
                    <select id="f_status" class="w-full border-2 border-slate-100 p-3 rounded-xl font-black text-sm"></select>
                </div>
                <div class="col-span-2">
                    <label class="text-slate-500 text-[9px] mb-1 block font-black uppercase tracking-widest">Notes Mécanos / Pièces</label>
                    <textarea id="f_comment" class="w-full border-2 border-slate-100 p-3 rounded-xl h-20 font-black text-sm bg-slate-50"></textarea>
                </div>
                <div id="deleteWrapper" class="col-span-2 hidden">
                    <button onclick="deleteTask()" class="w-full py-3 rounded-xl border-2 border-red-200 text-red-400 font-black text-[11px] hover:bg-red-50 hover:border-red-400 hover:text-red-600 transition-all italic uppercase tracking-widest">🗑 SUPPRIMER CETTE FICHE</button>
                </div>
                <button onclick="saveToSheets()" id="saveBtn" class="col-span-2 bg-[#0a0f18] text-[#004a99] py-5 rounded-2xl font-black shadow-xl hover:bg-[#004a99] hover:text-white transition-all border-2 border-[#004a99] tracking-[0.2em]">ENREGISTRER LA FICHE</button>
            </div>
        </div>
    </div>

    <!-- ===================== RAPPORT PANEL ===================== -->
    <div id="rapportPanel" class="fixed top-0 right-0 h-full w-full max-w-2xl bg-white shadow-2xl z-[3000] flex flex-col">

        <!-- Header -->
        <div class="bg-[#0a0f18] px-6 py-5 flex justify-between items-center border-b-2 border-[#004a99] flex-shrink-0">
            <div>
                <p class="text-[8px] text-slate-400 font-black tracking-widest uppercase not-italic">EMCAR SPORT — WORKSHOP</p>
                <h2 class="text-2xl font-black text-white italic tracking-tighter">RAPPORT <span class="text-[#004a99]">ACTIVITÉ</span></h2>
            </div>
            <button onclick="closeRapport()" class="w-9 h-9 rounded-full bg-slate-700 hover:bg-red-600 text-white flex items-center justify-center text-xl font-bold transition-all">×</button>
        </div>

        <!-- Filtres période -->
        <div class="px-6 py-4 border-b border-slate-100 flex-shrink-0 space-y-3">
            <div class="flex gap-2 flex-wrap">
                <button onclick="setPeriod('week')" id="pWeek" class="period-btn px-3 py-1.5 rounded-lg text-[9px] font-black uppercase not-italic bg-[#004a99] text-white">Cette semaine</button>
                <button onclick="setPeriod('month')" id="pMonth" class="period-btn px-3 py-1.5 rounded-lg text-[9px] font-black uppercase not-italic bg-slate-100 text-slate-600 hover:bg-slate-200">Ce mois</button>
                <button onclick="setPeriod('all')" id="pAll" class="period-btn px-3 py-1.5 rounded-lg text-[9px] font-black uppercase not-italic bg-slate-100 text-slate-600 hover:bg-slate-200">Tout</button>
            </div>
            <!-- Totaux globaux -->
            <div id="rapportTotals" class="grid grid-cols-4 gap-2"></div>
        </div>

        <!-- Liste jours -->
        <div id="rapportList" class="flex-1 overflow-y-auto px-6 py-4 space-y-4">
            <p class="text-slate-400 text-xs not-italic normal-case text-center py-8">Chargement...</p>
        </div>

        <!-- Footer export -->
        <div class="px-6 py-4 border-t border-slate-100 flex-shrink-0">
            <button onclick="exportCSV()" class="w-full bg-[#0a0f18] text-white py-3 rounded-xl font-black text-[11px] hover:bg-slate-700 transition-all tracking-widest italic uppercase flex items-center justify-center gap-2">
                ⬇ EXPORTER EN CSV
            </button>
        </div>
    </div>
    <div id="rapportBackdrop" onclick="closeRapport()" class="hidden fixed inset-0 bg-black/40 backdrop-blur-sm z-[2900]"></div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzrpGb7CVA4SFYGw2iGEQaacD1DWueysMg7Tgjm15g_bPY6J-Zh_pFA8Vha3aFi7a-F/exec";
        let localData = [];
        let rapportData = []; // données fusionnées Tasks + Servicing_Requests
        let currentPeriod = 'week';

        const STATUS_OPTIONS = {
            'Servicing': ["A faire", "Diagnostic", "En attente de Devis", "Validation de Devis", "En cours", "Pieces Manquantes", "Terminé"],
            'Montage': ["A faire", "En cours", "Terminé"]
        };

        function formatDateISO(dInput) {
            const d = new Date(dInput);
            if (isNaN(d)) return '';
            return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
        }

        function formatDateFR(iso) {
            const d = new Date(iso);
            if (isNaN(d)) return iso;
            return d.toLocaleDateString('fr-FR', { weekday: 'long', day: '2-digit', month: 'long', year: 'numeric' });
        }

        // ---- CALENDAR (identique à l'original) ----
        let weekOffset = 0; // 0 = semaine actuelle, -1 = semaine précédente, etc.

        function getMondayOfWeek(offset) {
            const today = new Date();
            const diff = today.getDay() === 0 ? -6 : 1 - today.getDay();
            const monday = new Date(today);
            monday.setDate(today.getDate() + diff + (offset * 7));
            monday.setHours(0,0,0,0);
            return monday;
        }

        function updateWeekLabel() {
            const monday = getMondayOfWeek(weekOffset);
            const sunday = new Date(monday); sunday.setDate(monday.getDate() + 5);
            const label = monday.toLocaleDateString('fr-FR', {day:'2-digit', month:'short'}) +
                          ' — ' +
                          sunday.toLocaleDateString('fr-FR', {day:'2-digit', month:'short', year:'numeric'});
            document.getElementById('weekLabel').innerText = label;
            const todayBtn = document.getElementById('todayBtn');
            if (weekOffset !== 0) todayBtn.classList.remove('hidden');
            else todayBtn.classList.add('hidden');
        }

        function changeWeek(dir) {
            weekOffset += dir;
            buildCalendar();
            load();
        }

        function goToCurrentWeek() {
            weekOffset = 0;
            buildCalendar();
            load();
        }

        function buildCalendar() {
            const grid = document.getElementById('calendarGrid');
            grid.innerHTML = '';
            const today = new Date();
            const monday = getMondayOfWeek(weekOffset);
            updateWeekLabel();

            for(let i = 0; i < 6; i++) {
                let d = new Date(monday); d.setDate(monday.getDate() + i);
                const iso = formatDateISO(d);
                const isToday = d.toDateString() === today.toDateString();
                const isPast = d < today && !isToday;
                grid.innerHTML += `
                    <div class="flex-1 min-w-[260px] flex flex-col">
                        <div class="bg-white px-4 pt-4 pb-3 rounded-t-2xl shadow-sm border-b-4 ${isToday ? 'border-[#004a99]' : isPast ? 'border-slate-300' : 'border-slate-100'}">
                            <div class="flex justify-between items-center">
                                <div>
                                    <p class="${isToday ? 'text-[#004a99]' : isPast ? 'text-slate-400' : 'text-slate-700'} text-xl font-black uppercase leading-none">${d.toLocaleDateString('fr-FR', { weekday: 'long' })}</p>
                                    <p class="text-[9px] text-slate-400 font-bold tracking-widest mt-1">${d.toLocaleDateString('fr-FR', { day: '2-digit', month: 'long' })}</p>
                                </div>
                                ${isToday ? '<span class="bg-[#004a99] text-white text-[8px] font-black px-2 py-0.5 rounded-full not-italic tracking-widest">AUJOURD\'HUI</span>' : ''}
                                ${isPast && weekOffset !== 0 ? '<span class="text-[8px] text-slate-300 font-black not-italic">PASSÉ</span>' : ''}
                            </div>
                            <div class="flex items-center gap-2 mt-2">
                                <div class="flex-1 h-1.5 bg-slate-100 rounded-full overflow-hidden">
                                    <div id="load-bar-${iso}" class="bg-[#004a99] h-full transition-all" style="width:0%"></div>
                                </div>
                                <span id="load-text-${iso}" class="text-[9px] font-black text-slate-400 whitespace-nowrap">0H / 8H</span>
                            </div>
                        </div>
                        <div id="col-${iso}" class="flex-1 ${isPast ? 'bg-slate-100/80' : 'bg-slate-50'} p-3 space-y-3 rounded-b-2xl overflow-y-auto"></div>
                    </div>
                `;
            }
        }

        function calculateTime(t) {
            const details = (t.details || "").toUpperCase();
            const name    = (t.name    || "").toUpperCase();
            const notes   = (t.notes   || t.comment || "").toUpperCase();
            const allText = details + " " + name + " " + notes;

            // Full Day si Outdoor ou On-site (480 min = 8h)
            if (allText.includes("OUTDOOR") || allText.includes("ON-SITE") || allText.includes("ONSITE")) return 480;

            if (t.type === "Servicing") {
                if (t.servType === "Minor Servicing") return 35;
                if (t.servType === "Full Servicing") return 75;
                if (t.servType === "Réparations" || t.servType === "Reparations") {
                    if (details.includes("SCALPEL") || details.includes("SUPERSIX") || details.includes("SYNAPSE")) return 75;
                    return 60;
                }
                return 30;
            }
            if (t.type === "Montage") {
                if (details.includes("SCALPEL")) return 150;
                if (details.includes("SUPERSIX")) return 120;
                if (details.includes("SYNAPSE")) return 75;
                const kidSizes = ["12\"", "14\"", "16\"", "20\"", "24\"", "26\""];
                if (kidSizes.some(s => details.includes(s))) return 35;
                if (details.includes("QUICK CX") || details.includes("TREADWELL") || details.includes("TRAIL")) return 60;
                return 60;
            }
            return 0;
        }

        function isTermine(status) {
            // Gère "Terminé" avec accent ET "Termine" sans accent
            return (status || "").toLowerCase().replace(/[éè]/g, "e").trim() === "termine";
        }

        async function load() {
            try {
                const res = await fetch(SCRIPT_URL + "?getTasks=true");
                localData = await res.json();
                const dailyLoad = {};

                localData.forEach(t => {
                    const taskDate = formatDateISO(t.date);
                    const col = document.getElementById('col-' + taskDate);
                    const done = isTermine(t.status);
                    // Semaine actuelle : cacher les Terminé / Semaines passées : tout afficher
                    if (col && !(weekOffset === 0 && done)) {
                        const time = calculateTime(t);
                        if (!done) dailyLoad[taskDate] = (dailyLoad[taskDate] || 0) + time;
                        const card = document.createElement('div');
                        card.className = "bg-white p-5 rounded-2xl shadow-md border-l-[10px] cursor-pointer hover:-translate-y-1 transition-all "
                            + (t.type === 'Servicing' ? 'border-[#004a99]' : 'border-[#e67e22]')
                            + (done ? ' opacity-50 grayscale' : '');
                        card.onclick = () => editTask(t.id);

                        // Badge spécial Full Day
                        const isFullDay = time === 480;
                        const timeLabel = isFullDay ? 'FULL DAY' : time + ' MIN';
                        const timeColor = isFullDay ? 'text-purple-600' : (t.type === 'Servicing' ? 'text-blue-600' : 'text-orange-600');

                        card.innerHTML =
                            '<div class="flex justify-between items-center mb-2">' +
                                '<span class="bg-slate-100 text-slate-500 px-2 py-0.5 rounded text-[8px] font-bold">' + t.id + '</span>' +
                                '<span class="' + timeColor + ' text-[8px] font-black tracking-widest">' + timeLabel + '</span>' +
                            '</div>' +
                            (t.details ? '<p class="text-[11px] text-slate-900 font-black mb-1 leading-tight">' + t.details + '</p>' : '') +
                            '<p class="text-slate-500 text-[10px] mb-3 leading-tight">' + (t.name || '') + '</p>' +
                            '<div class="flex items-center gap-2">' +
                                '<div class="w-2 h-2 rounded-full ' + (t.status === 'En cours' ? 'bg-green-500 animate-pulse' : done ? 'bg-emerald-400' : 'bg-slate-300') + '"></div>' +
                                '<span class="text-slate-800 font-black text-[9px] tracking-wider">' + t.status + '</span>' +
                            '</div>';
                        col.appendChild(card);
                    }
                });

                Object.keys(dailyLoad).forEach(date => {
                    const totalMin = dailyLoad[date];
                    const percent = Math.min((totalMin / 480) * 100, 100);
                    const bar = document.getElementById('load-bar-' + date);
                    const text = document.getElementById('load-text-' + date);
                    if(bar) {
                        bar.style.width = percent + "%";
                        if(percent >= 100) bar.className = "bg-purple-600 h-full transition-all";
                        else if(percent > 85) bar.className = "bg-red-500 h-full transition-all";
                        else if(percent > 65) bar.className = "bg-orange-500 h-full transition-all";
                        else bar.className = "bg-[#004a99] h-full transition-all";
                    }
                    if(text) {
                        const label = totalMin >= 480 ? 'FULL DAY' : (totalMin/60).toFixed(1) + 'H / 8H';
                        text.innerText = label;
                    }
                });
            } catch(e) { console.error(e); }
        }

        function openForm(type) {
            document.getElementById('taskModal').classList.remove('hidden');
            document.getElementById('f_id').value = "";
            document.getElementById('modalTitle').innerText = (type === 'Servicing' ? 'ORDRE DE SERVICE' : 'FICHE DE MONTAGE');
            document.getElementById('f_date').value = formatDateISO(new Date());
            document.getElementById('f_status').innerHTML = STATUS_OPTIONS[type].map(o => `<option value="${o}">${o}</option>`).join('');
            document.getElementById('servicingFields').classList.toggle('hidden', type !== 'Servicing');
            document.getElementById('montageFields').classList.toggle('hidden', type !== 'Montage');
            // Cacher le bouton supprimer sur une nouvelle fiche
            document.getElementById('deleteWrapper').classList.add('hidden');
            ['f_name', 'f_servModel', 'f_phone', 'f_model', 'f_comment'].forEach(id => { if(document.getElementById(id)) document.getElementById(id).value = ""; });
        }

        function editTask(id) {
            const t = localData.find(x => x.id == id);
            if(!t) return;
            openForm(t.type);
            document.getElementById('f_id').value      = t.id;
            document.getElementById('f_name').value    = t.name    || "";
            document.getElementById('f_date').value    = formatDateISO(t.date);
            document.getElementById('f_status').value  = t.status  || "";
            document.getElementById('f_comment').value = t.notes   || t.comment || "";
            if(t.type === 'Servicing') {
                document.getElementById('f_servModel').value = t.details  || "";
                document.getElementById('f_phone').value     = t.phone    || "";
                document.getElementById('f_servType').value  = t.servType || t.bikes || "Minor Servicing";
            } else {
                document.getElementById('f_model').value   = t.details || "";
                document.getElementById('f_reqType').value = t.reqType || t.size || "Stock";
            }
            // Afficher le bouton supprimer seulement en mode édition
            document.getElementById('deleteWrapper').classList.remove('hidden');
        }

        // Envoi vers Google Apps Script — fetch no-cors SANS Content-Type (évite le preflight)
        async function sendToGAS(payload) {
            try {
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode:   'no-cors',
                    body:   JSON.stringify(payload)
                });
                return true;
            } catch(e) {
                console.error('GAS error:', e);
                return false;
            }
        }

        async function saveToSheets() {
            const btn = document.getElementById('saveBtn');
            btn.innerText = "ENVOI...";
            btn.disabled  = true;

            const type = document.getElementById('modalTitle').innerText.includes('SERVICE') ? 'Servicing' : 'Montage';
            const taskId = document.getElementById('f_id').value || ("T-" + Date.now());
            const payload = {
                action: 'add_task',
                task: {
                    id:      taskId,
                    type:    type,
                    client:  document.getElementById('f_name').value,
                    date:    document.getElementById('f_date').value,
                    status:  document.getElementById('f_status').value,
                    phone:   (document.getElementById('f_phone') ? document.getElementById('f_phone').value : '') || "",
                    email:   "",
                    details: type === 'Servicing' ? document.getElementById('f_servModel').value : document.getElementById('f_model').value,
                    size:    type === 'Montage'   ? document.getElementById('f_reqType').value   : "",
                    notes:   document.getElementById('f_comment').value,
                    bikes:   type === 'Servicing' ? document.getElementById('f_servType').value  : document.getElementById('f_model').value
                }
            };

            // Mise à jour locale immédiate — la carte apparait tout de suite sans attendre le sheet
            const taskObj = {
                id:       payload.task.id,
                type:     payload.task.type,
                name:     payload.task.client,
                date:     payload.task.date,
                status:   payload.task.status,
                phone:    payload.task.phone,
                details:  payload.task.details,
                notes:    payload.task.notes,
                servType: payload.task.bikes,
                reqType:  payload.task.size,
                bikes:    payload.task.bikes,
                size:     payload.task.size
            };
            const idx = localData.findIndex(function(x){ return x.id === taskId; });
            if (idx >= 0) localData[idx] = taskObj;
            else localData.push(taskObj);

            closeModal();
            buildCalendar();
            load();

            // Envoie en arrière-plan
            sendToGAS(payload);

            btn.innerText = "ENREGISTRER LA FICHE";
            btn.disabled  = false;
        }

        async function deleteTask() {
            const id = document.getElementById('f_id').value;
            if (!id) { alert('Aucune fiche sélectionnée.'); return; }
            if (!confirm('Supprimer cette fiche ? Cette action est irréversible.')) return;

            // Suppression locale immédiate
            localData = localData.filter(function(x){ return x.id !== id; });
            closeModal();
            buildCalendar();
            load();

            // Envoie en arrière-plan
            sendToGAS({ action: 'delete_task', id: id });
        }

        function closeModal() { document.getElementById('taskModal').classList.add('hidden'); }

        function closeModal() { document.getElementById('taskModal').classList.add('hidden'); }


        // ===================== RAPPORT =====================
        async function openRapport() {
            document.getElementById('rapportPanel').classList.add('open');
            document.getElementById('rapportBackdrop').classList.remove('hidden');

            // Si données pas encore chargées ou vides, on récupère depuis Apps Script
            if (rapportData.length === 0) {
                await loadRapportData();
            }
            renderRapport();
        }

        function closeRapport() {
            document.getElementById('rapportPanel').classList.remove('open');
            document.getElementById('rapportBackdrop').classList.add('hidden');
        }

        async function loadRapportData() {
            document.getElementById('rapportList').innerHTML = '<p class="text-slate-400 text-xs not-italic normal-case text-center py-8">Chargement des données...</p>';
            try {
                // Charge les tasks du planning (onglet Tasks)
                const resTasks = await fetch(SCRIPT_URL + "?getTasks=true");
                const tasks = await resTasks.json();

                // Charge l'historique Servicing_Requests via Apps Script
                const resHist = await fetch(SCRIPT_URL + "?getHistory=true");
                const hist = await resHist.json();

                // Fusionne les deux sources
                // Tasks → déjà au bon format
                const fromTasks = tasks.map(t => ({
                    source: 'Planning',
                    type: t.type,
                    name: t.name || '',
                    model: t.details || '',
                    servType: t.servType || t.bikes || '',
                    status: t.status || '',
                    date: formatDateISO(t.date)
                }));

                // Servicing_Requests → mapper les colonnes
                const fromHist = hist.map(h => ({
                    source: 'Historique',
                    type: 'Servicing',
                    name: h.name || '',
                    model: h.model || '',
                    servType: h.service || '',
                    status: h.status || '',
                    date: h.date || ''  // déjà en dd/MM/yyyy ou ISO depuis le script
                }));

                rapportData = [...fromTasks, ...fromHist].filter(r => r.date);
            } catch(e) {
                console.error(e);
                document.getElementById('rapportList').innerHTML = '<p class="text-red-400 text-xs not-italic normal-case text-center py-8">Erreur de chargement. Vérifiez que le Apps Script est bien déployé.</p>';
            }
        }

        function setPeriod(p) {
            currentPeriod = p;
            document.querySelectorAll('.period-btn').forEach(b => {
                b.className = 'period-btn px-3 py-1.5 rounded-lg text-[9px] font-black uppercase not-italic bg-slate-100 text-slate-600 hover:bg-slate-200';
            });
            const ids = { week: 'pWeek', month: 'pMonth', all: 'pAll' };
            document.getElementById(ids[p]).className = 'period-btn px-3 py-1.5 rounded-lg text-[9px] font-black uppercase not-italic bg-[#004a99] text-white';
            renderRapport();
        }

        function filterByPeriod(data) {
            const now = new Date();
            return data.filter(r => {
                // Parse date (ISO ou dd/MM/yyyy)
                let d;
                if (r.date && r.date.includes('/')) {
                    const parts = r.date.split('/');
                    d = new Date(parts[2], parts[1]-1, parts[0]);
                } else {
                    d = new Date(r.date);
                }
                if (isNaN(d)) return false;
                if (currentPeriod === 'week') {
                    const diff = now.getDay() === 0 ? -6 : 1 - now.getDay();
                    const monday = new Date(now); monday.setDate(now.getDate() + diff); monday.setHours(0,0,0,0);
                    const sunday = new Date(monday); sunday.setDate(monday.getDate() + 6); sunday.setHours(23,59,59,999);
                    return d >= monday && d <= sunday;
                }
                if (currentPeriod === 'month') {
                    return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
                }
                return true;
            });
        }

        function parseDateKey(r) {
            if (r.date && r.date.includes('/')) {
                const parts = r.date.split('/');
                return parts[2] + '-' + parts[1].padStart(2,'0') + '-' + parts[0].padStart(2,'0');
            }
            return r.date;
        }

        function renderRapport() {
            const filtered = filterByPeriod(rapportData);

            // Totaux globaux
            const totalServ  = filtered.filter(r => r.type === 'Servicing').length;
            const totalMont  = filtered.filter(r => r.type === 'Montage').length;
            const totalDone  = filtered.filter(r => (r.status || '').toLowerCase().includes('termin')).length;
            const totalPend  = filtered.filter(r => !(r.status || '').toLowerCase().includes('termin')).length;
            document.getElementById('rapportTotals').innerHTML = `
                <div class="bg-blue-50 rounded-xl p-3 text-center">
                    <p class="text-2xl font-black text-[#004a99] italic">${totalServ}</p>
                    <p class="text-[8px] text-blue-400 font-black not-italic uppercase tracking-widest">Servicing</p>
                </div>
                <div class="bg-orange-50 rounded-xl p-3 text-center">
                    <p class="text-2xl font-black text-[#e67e22] italic">${totalMont}</p>
                    <p class="text-[8px] text-orange-400 font-black not-italic uppercase tracking-widest">Montage</p>
                </div>
                <div class="bg-emerald-50 rounded-xl p-3 text-center">
                    <p class="text-2xl font-black text-emerald-600 italic">${totalDone}</p>
                    <p class="text-[8px] text-emerald-400 font-black not-italic uppercase tracking-widest">Terminés</p>
                </div>
                <div class="bg-slate-50 rounded-xl p-3 text-center">
                    <p class="text-2xl font-black text-slate-600 italic">${totalServ + totalMont}</p>
                    <p class="text-[8px] text-slate-400 font-black not-italic uppercase tracking-widest">Total</p>
                </div>`;

            // Grouper par date
            const byDate = {};
            filtered.forEach(r => {
                const key = parseDateKey(r);
                if (!key) return;
                if (!byDate[key]) byDate[key] = [];
                byDate[key].push(r);
            });

            const sortedDates = Object.keys(byDate).sort((a,b) => new Date(b) - new Date(a));

            if (sortedDates.length === 0) {
                document.getElementById('rapportList').innerHTML = '<p class="text-slate-400 text-xs not-italic normal-case text-center py-8">Aucune donnée pour cette période.</p>';
                return;
            }

            document.getElementById('rapportList').innerHTML = sortedDates.map(date => {
                const items = byDate[date];
                const serv  = items.filter(r => r.type === 'Servicing');
                const mont  = items.filter(r => r.type === 'Montage');
                const done  = items.filter(r => (r.status||'').toLowerCase().includes('termin')).length;
                const dateLabel = formatDateFR(date);

                const rows = items.map(r => {
                    const isServ = r.type === 'Servicing';
                    const statusColor = (r.status||'').toLowerCase().includes('termin') ? 'text-emerald-600'
                        : (r.status||'').toLowerCase().includes('cours') ? 'text-green-600'
                        : (r.status||'').toLowerCase().includes('attente') ? 'text-yellow-600'
                        : (r.status||'').toLowerCase().includes('r\xe9paration') ? 'text-red-500'
                        : 'text-slate-400';
                    return `<tr class="border-b border-slate-50 hover:bg-slate-50">
                        <td class="py-2 pr-3">
                            <span class="inline-block px-2 py-0.5 rounded text-[8px] font-black not-italic ${isServ ? 'bg-blue-100 text-blue-600' : 'bg-orange-100 text-orange-600'}">${r.type}</span>
                        </td>
                        <td class="py-2 pr-3 font-black text-[10px] text-slate-800 italic">${r.name || '—'}</td>
                        <td class="py-2 pr-3 text-[9px] text-slate-500 not-italic normal-case">${r.model || '—'}</td>
                        <td class="py-2 pr-3 text-[9px] text-slate-500 not-italic normal-case">${r.servType || '—'}</td>
                        <td class="py-2 text-[9px] font-black ${statusColor} not-italic">${r.status || '—'}</td>
                    </tr>`;
                }).join('');

                return `<div class="day-block pl-4 py-1">
                    <div class="flex justify-between items-center mb-2">
                        <div>
                            <p class="text-[13px] font-black text-slate-800 italic uppercase">${dateLabel}</p>
                            <div class="flex gap-3 mt-1">
                                <span class="text-[9px] font-black text-[#004a99] not-italic">${serv.length} Servicing</span>
                                <span class="text-[9px] font-black text-[#e67e22] not-italic">${mont.length} Montage</span>
                                <span class="text-[9px] font-black text-emerald-600 not-italic">${done} Terminés</span>
                            </div>
                        </div>
                        <span class="text-2xl font-black text-slate-200 italic">${items.length}</span>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left">
                            <thead>
                                <tr class="border-b-2 border-slate-100">
                                    <th class="pb-1 text-[8px] text-slate-400 font-black not-italic uppercase tracking-widest pr-3">Type</th>
                                    <th class="pb-1 text-[8px] text-slate-400 font-black not-italic uppercase tracking-widest pr-3">Client</th>
                                    <th class="pb-1 text-[8px] text-slate-400 font-black not-italic uppercase tracking-widest pr-3">Modèle</th>
                                    <th class="pb-1 text-[8px] text-slate-400 font-black not-italic uppercase tracking-widest pr-3">Service</th>
                                    <th class="pb-1 text-[8px] text-slate-400 font-black not-italic uppercase tracking-widest">Statut</th>
                                </tr>
                            </thead>
                            <tbody>${rows}</tbody>
                        </table>
                    </div>
                </div>`;
            }).join('');
        }

        function exportCSV() {
            const filtered = filterByPeriod(rapportData);
            if (filtered.length === 0) { alert('Aucune donnée à exporter.'); return; }
            const header = ['Date','Type','Client','Modèle','Service','Statut','Source'];
            const lines = filtered.map(r => [
                parseDateKey(r), r.type, r.name, r.model, r.servType, r.status, r.source
            ].map(v => '"' + (v||'').replace(/"/g,'""') + '"').join(','));
            const csv = [header.join(','), ...lines].join('\n');
            const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = 'rapport_emcar_' + formatDateISO(new Date()) + '.csv';
            a.click(); URL.revokeObjectURL(url);
        }

        buildCalendar();
        load();

        // Enregistrement du Service Worker PWA
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('service-worker.js')
                .then(function(reg) { console.log('SW enregistré:', reg.scope); })
                .catch(function(err) { console.log('SW erreur:', err); });
        }
    </script>
